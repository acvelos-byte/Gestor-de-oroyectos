<style>

.wrap{padding:16px;padding-bottom:100px;max-width:900px;margin:0 auto}

.nav button{flex:1;background:none;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--g6);font-size:11px;font-weight:500;min-height:56px}

.b-baja{background:#e2e3e5;color:#383d41}
.b-media{background:#cce5ff;color:#004085}

.b-urgente{background:#f8d7da;color:#721c24}

.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fg{margin-bottom:14px}
.fg label{display:block;margin-bottom:6px;font-weight:500;font-size:13px}
.fg input,.fg select,.fg textarea{width:100%;padding:11px 12px;border:1px solid var(--g3);border-radius:8px;font-size:15px;background:#fff}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px rgba(68,114,196,.15)}
.btnp{background:var(--p);color:#fff;padding:12px 20px;border-radius:10px;font-weight:600;font-size:15px;width:100%;min-height:48px}
.btnp:active{background:var(--pd)}
.btns{background:var(--g2);color:var(--g8);padding:10px 16px;border-radius:10px;font-weight:500;font-size:14px;min-height:42px}

.brow{display:flex;gap:8px;flex-wrap:wrap}
.brow button{flex:1}
.mdl{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;display:none;align-items:flex-end;justify-content:center}
.mdl.on{display:flex}
.mcnt{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:600px;max-height:92vh;overflow-y:auto;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom));animation:up .28s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.mhdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;position:sticky;top:-20px;background:#fff;padding:8px 0;z-index:2}
.mhdr h2{font-size:18px}
.mcls{background:var(--g2);width:36px;height:36px;border-radius:50%;font-size:20px;display:flex;align-items:center;justify-content:center}
.tst{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--g8);color:#fff;padding:12px 20px;border-radius:24px;font-size:14px;z-index:1000;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center}
.tst.on{opacity:1}
.tst.err{background:var(--bad)}
.tst.ok{background:var(--ok)}
.clist{max-height:200px;overflow-y:auto;margin-bottom:12px}
.cm{background:var(--g1);padding:10px;border-radius:8px;margin-bottom:8px;font-size:13px}
.cmh{display:flex;justify-content:space-between;font-size:11px;color:var(--g6);margin-bottom:4px;font-weight:600}
.emp{text-align:center;padding:40px 20px;color:var(--g6)}
.emp .ico{font-size:56px;margin-bottom:12px;opacity:.5}
.spl{position:fixed;inset:0;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;z-index:9999;color:#fff;text-align:center;padding:20px}
.splc{background:rgba(255,255,255,.15);backdrop-filter:blur(10px);border-radius:20px;padding:40px 24px;max-width:380px;width:100%}
.spl h1{font-size:22px;margin-bottom:8px}
.spl p{opacity:.9;margin-bottom:24px;font-size:14px}
.spl .btnp{background:#fff;color:var(--p)}
.hide{display:none!important}
.portfolio{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:14px}.portfolio .pcard{margin:0;min-height:190px}.welcome{padding:22px;border-radius:16px;background:linear-gradient(135deg,#1f3c88,#4472C4 55%,#31a8a0);color:#fff;margin-bottom:16px;box-shadow:0 8px 22px rgba(31,60,136,.22)}.welcome h2{font-size:23px;margin-bottom:5px}.welcome p{font-size:13px;opacity:.9}.quickbar{display:flex;gap:8px;overflow:auto;margin:0 0 16px}.quickbar button{white-space:nowrap;background:#fff;border:1px solid var(--g3);border-radius:20px;padding:9px 13px;color:var(--g8)}.quickbar button.on{background:var(--p);border-color:var(--p);color:#fff}.project-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.project-kpis div{background:var(--g1);border-radius:8px;padding:8px;text-align:center}.project-kpis b{display:block;font-size:15px}.project-kpis span{font-size:10px;color:var(--g6)}
 :root.dark{--g1:#151922;--g2:#252b36;--g3:#3b4350;--g6:#aeb7c4;--g8:#f1f4f8;--sh:0 2px 10px rgba(0,0,0,.3)}.dark body{background:var(--g1);color:var(--g8)}.dark .card,.dark .pcard,.dark .stat,.dark .nav,.dark .mcnt,.dark .quickbar button{background:#1d232d;color:var(--g8)}.dark .fg input,.dark .fg select,.dark .fg textarea,.dark .flt input,.dark .flt select{background:#252b36;color:var(--g8);border-color:var(--g3)}.dark .project-kpis div{background:#252b36}.project-cover{width:100%;height:110px;object-fit:cover;border-radius:9px;margin-bottom:12px;display:block;background:var(--g2)}
.project-layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px;align-items:start}.project-sidebar{position:sticky;top:82px}.eval-row{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--g3);font-size:13px}.eval-row:last-child{border-bottom:0}.eval-row b{text-align:right}.eval-good{color:var(--ok)}.eval-bad{color:var(--bad)}.eval-neutral{color:var(--p)}@media(max-width:700px){.project-layout{display:block}.project-sidebar{position:static;margin-top:16px}}
.risk-item{padding:10px;border-left:4px solid var(--g3);background:var(--g1);border-radius:7px;margin-bottom:8px}.risk-item.risk-bajo{border-left-color:var(--ok)}.risk-item.risk-medio{border-left-color:var(--warn)}.risk-item.risk-alto{border-left-color:#e67e22}.risk-item.risk-critico{border-left-color:var(--bad)}.risk-head{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:700}.risk-text{font-size:13px;margin-top:4px}.risk-state{font-size:11px;color:var(--g6);margin-top:5px}
.pcard{animation:cardIn .35s ease both}.pcard:hover{transform:translateY(-4px);box-shadow:0 8px 20px rgba(68,114,196,.18)}.pcard:focus-within{outline:3px solid rgba(68,114,196,.25)}.pfill{animation:growBar .7s ease both}.interactive-search{position:relative;margin-bottom:14px}.interactive-search input{width:100%;padding:13px 42px 13px 14px;border:1px solid var(--g3);border-radius:10px;background:#fff;color:var(--g8)}.dark .interactive-search input{background:#252b36;color:var(--g8)}.interactive-search span{position:absolute;right:14px;top:10px;font-size:20px}.filter-count{font-size:12px;color:var(--g6);margin:6px 0 12px}@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes growBar{from{transform:scaleX(0);transform-origin:left}to{transform:scaleX(1)}}
.timeline-card{background:#fff;border-radius:12px;padding:16px;box-shadow:var(--sh);margin:14px 0}.dark .timeline-card{background:#1d232d}.timeline{position:relative;padding:34px 8px 8px}.timeline-track{height:8px;background:var(--g2);border-radius:8px;position:relative}.timeline-progress{height:100%;width:var(--progress);background:linear-gradient(90deg,#4472C4,#28a745);border-radius:8px;transition:width .8s ease}.plane{position:absolute;left:clamp(14px,var(--progress),calc(100% - 14px));top:50%;z-index:2;transform:translate(-50%,-50%);font-size:28px;transition:left .8s ease;filter:drop-shadow(0 3px 3px rgba(0,0,0,.2));animation:planeFloat 1.8s ease-in-out infinite}.timeline-card.done .plane{left:calc(100% - 14px);animation:none;transform:translate(-50%,-50%) rotate(8deg)}.timeline-labels{display:flex;justify-content:space-between;gap:6px;margin-top:12px;color:var(--g6);font-size:11px}.timeline-labels span{text-align:center}.timeline-percent{text-align:center;font-weight:700;font-size:18px;margin-bottom:8px;color:var(--p)}.timeline-done{text-align:center;color:var(--ok);font-size:12px;font-weight:600;margin-top:8px}@keyframes planeFloat{0%,100%{transform:translate(-50%,-50%) rotate(-3deg)}50%{transform:translate(-50%,calc(-50% - 3px)) rotate(3deg)}
</style>
</head>
<body>
<div id="spl" class="spl"><div class="splc"><h1>🗂️ Gestor de Proyectos</h1><p>Organiza tu trabajo desde el móvil</p><button class="btnp" onclick="iniciar()">Comenzar</button></div></div>
<header class="hdr"><button class="hbtn hide" id="back" onclick="volver()">←</button><button class="hbtn" id="taskHeadBtn" onclick="agregarTarea()" title="Agregar tarea" aria-label="Agregar tarea">✅</button><button class="hbtn" onclick="abrirBloc()" title="Bloc de notas" aria-label="Bloc de notas">📝</button><button class="hbtn" onclick="abrirRiesgos()" title="Riesgos del proyecto" aria-label="Riesgos del proyecto">⚠️</button><button class="hbtn" onclick="abrirInteresados()" title="Interesados del proyecto" aria-label="Interesados del proyecto">👥</button><h1 id="ttl">Mis Proyectos</h1><button class="hbtn" onclick="menuOpc()">⋮</button></header>
<main class="wrap" id="app"></main>
<button class="fab hide" id="fab" onclick="accion()">+</button>
<nav class="nav" id="nav">
<button data-v="dashboard" class="on" onclick="ir('dashboard')"><span>🏠</span><span>Inicio</span></button>
<button data-v="proyectos" onclick="ir('proyectos')"><span>📁</span><span>Proyectos</span></button>
<button data-v="tareas" onclick="ir('tareas')"><span>✅</span><span>Tareas</span></button>
<button data-v="stats" onclick="ir('stats')"><span>📊</span><span>Gráficas</span></button>
</nav>
<div class="mdl" id="mdl"><div class="mcnt" id="mcnt"></div></div>
<div class="tst" id="tst"></div>
<script>
const DB={k:'gp_v1',d(){try{const localValue=localStorage.getItem(this.k);const fallback={proyectos:[],tareas:[],np:1,nt:1};if(location.protocol==='file:'){return localValue?JSON.parse(localValue):fallback;}if(localValue){try{return JSON.parse(localValue)}catch{return fallback}}return fallback}catch{return{proyectos:[],tareas:[],np:1,nt:1}}},s(d){localStorage.setItem(this.k,JSON.stringify(d));if(location.protocol!=='file:'){fetch('/api/data',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).catch(()=>{})}},proyectos(){return this.d().proyectos},getProyecto(id){return this.d().proyectos.find(p=>p.id==id)},addProyecto(p){const d=this.d();p.id=d.np++;p.fc=new Date().toISOString();d.proyectos.push(p);this.s(d);return p},updProyecto(id,c){const d=this.d();const i=d.proyectos.findIndex(p=>p.id==id);if(i>=0)Object.assign(d.proyectos[i],c);this.s(d)},delProyecto(id){const d=this.d();d.proyectos=d.proyectos.filter(p=>p.id!=id);d.tareas=d.tareas.filter(t=>t.proyectoId!=id);this.s(d)},tareas(pid=null){const t=this.d().tareas;return pid?t.filter(x=>x.proyectoId==pid):t},getTarea(id){return this.d().tareas.find(t=>t.id==id)},addTarea(t){const d=this.d();t.id=d.nt++;t.fc=new Date().toISOString();t.estado=t.estado||'pendiente';t.prioridad=t.prioridad||'media';t.coms=t.coms||[];d.tareas.push(t);this.s(d);return t},updTarea(id,c){const d=this.d();const i=d.tareas.findIndex(t=>t.id==id);if(i>=0){Object.assign(d.tareas[i],c);if(c.estado==='completada')d.tareas[i].fcom=Date.now();else if(c.estado)d.tareas[i].fcom=null}this.s(d)},delTarea(id){const d=this.d();d.tareas=d.tareas.filter(t=>t.id!=id);this.s(d)},addCom(tid,txt){const d=this.d();const t=d.tareas.find(x=>x.id==tid);if(t){t.coms=t.coms||[];t.coms.push({id:Date.now(),txt,f:new Date().toISOString()});this.s(d)}},stats(){const d=this.d();const tot=d.tareas.length;const ok=d.tareas.filter(t=>t.estado==='completada').length;const pr=d.tareas.filter(t=>t.estado==='en_progreso').length;const pd=d.tareas.filter(t=>t.estado==='pendiente').length;const bl=d.tareas.filter(t=>t.estado==='bloqueada').length;const vc=d.tareas.filter(t=>t.fl&&t.estado!=='completada'&&new Date(t.fl)<new Date()).length;return{proyectos:d.proyectos.length,total:tot,ok,pr,pd,bl,vc,prog:tot?Math.round(ok/tot*100):0}},statsP(id){const t=this.tareas(id);const tot=t.length;const ok=t.filter(x=>x.estado==='completada').length;return{tot,ok,prog:tot?Math.round(ok/tot*100):0}},exportar(){return JSON.stringify(this.d(),null,2)},importar(j){try{const d=JSON.parse(j);if(!d.proyectos||!d.tareas)throw 0;this.s(d);return true}catch{return false}}};
let vista='dashboard',pid=null,flt={txt:'',est:'',pri:''};
function hydrateFromServerIfAvailable(){if(location.protocol==='file:')return;fetch('/api/data',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(data=>{if(data&&Array.isArray(data.proyectos)&&Array.isArray(data.tareas)){localStorage.setItem(DB.k,JSON.stringify(data));if(typeof render==='function')render();}}).catch(()=>{})}
function tst(m,t=''){const e=document.getElementById('tst');e.textContent=m;e.className='tst on '+t;clearTimeout(e._t);e._t=setTimeout(()=>e.className='tst '+t,2200)}
function ff(iso){if(!iso)return'';return new Date(iso).toLocaleDateString('es-ES',{day:'2-digit',month:'short'})}
function eh(s){return(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function ie(e){return{pendiente:'⏳',en_progreso:'🔄',completada:'✅',bloqueada:'🚫'}[e]||'⏳'}
function le(e){return{pendiente:'Pendiente',en_progreso:'En progreso',completada:'Completada',bloqueada:'Bloqueada'}[e]||e}
function lp(p){return{baja:'Baja',media:'Media',alta:'Alta',urgente:'Urgente'}[p]||p}
function money(n){return new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(Number(n)||0)}
function costStats(){const ps=DB.proyectos();const presupuesto=ps.reduce((n,p)=>n+(Number(p.presupuesto)||0),0);const gastado=ps.reduce((n,p)=>n+(Number(p.gastado)||0),0);return{presupuesto,gastado,restante:presupuesto-gastado,porcentaje:presupuesto?Math.round(gastado/presupuesto*100):0}}
function iniciar(){document.getElementById('spl').classList.add('hide');render()}
function ir(v){vista=v;pid=null;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));render()}
function volver(){pid=null;ir('proyectos')}
function setHdr(t,bv){document.getElementById('ttl').textContent=t;document.getElementById('back').classList.toggle('hide',!bv)}
function agregarTarea(){const proyectos=DB.proyectos();if(Number(pid)>0&&DB.getProyecto(Number(pid))){nuevaT();return}if(!proyectos.length){tst('Primero crea un proyecto','err');return}if(proyectos.length===1){pid=proyectos[0].id;nuevaT();return}openM(mhdr('Agregar tarea')+`<div class="fg"><label>Proyecto</label><select id="taskProject">${proyectos.map(p=>`<option value="${p.id}">${eh(p.nombre)}</option>`).join('')}</select></div><button class="btnp" onclick="seleccionarProyectoTarea()">Continuar con la tarea</button>`)}
function seleccionarProyectoTarea(){pid=Number(document.getElementById('taskProject').value);closeM();nuevaT()}
function setNav(v){document.getElementById('nav').style.display=v?'flex':'none'}
function setFab(v){document.getElementById('fab').classList.toggle('hide',!v)}
function render(){if(pid){setNav(0);setFab(1);renderP();return}setNav(1);setFab(1);if(vista==='dashboard'){setHdr('Inicio',0);renderDash()}else if(vista==='proyectos'){setHdr('Proyectos',0);renderPrys()}else if(vista==='tareas'){setHdr('Tareas',0);renderTG()}else if(vista==='stats'){setHdr('Estadísticas',0);renderStats()}}
function renderDash(){const s=DB.stats();const prs=DB.proyectos();document.getElementById('app').innerHTML=`<div class="stats"><div class="stat"><div class="ico">📁</div><div class="val">${s.proyectos}</div><div class="lb">Proyectos</div></div><div class="stat"><div class="ico">📋</div><div class="val">${s.total}</div><div class="lb">Tareas</div></div><div class="stat ok"><div class="ico">✅</div><div class="val">${s.ok}</div><div class="lb">Completadas</div></div><div class="stat bad"><div class="ico">⚠️</div><div class="val">${s.vc}</div><div class="lb">Vencidas</div></div></div><div class="card"><h2>Progreso Global</h2><div class="pwrap"><div class="pbar"><div class="pfill" style="width:${s.prog}%"></div></div><span>${s.prog}%</span></div></div><h2 style="font-size:16px;margin:20px 0 12px">Proyectos recientes</h2>${prs.length?prs.slice(-3).reverse().map(pcard).join(''):`<div class="emp"><div class="ico">📁</div><p>Sin proyectos aún</p><p style="font-size:13px;margin-top:8px">Toca + para crear uno</p></div>`}`}
function renderPrys(){const prs=DB.proyectos();document.getElementById('app').innerHTML=prs.length?prs.map(pcard).join(''):`<div class="emp"><div class="ico">📁</div><p>No hay proyectos</p></div>`}
function pcard(p){const s=DB.statsP(p.id);const presupuesto=Number(p.presupuesto)||0;const gastado=Number(p.gastado)||0;return`<div class="pcard" onclick="abrirP(${p.id})"><h3>${eh(p.nombre)}</h3><div class="desc">${eh(p.desc)||'Sin descripción'}</div><div class="pmeta"><span>${s.ok}/${s.tot} tareas</span><span>${s.prog}%</span></div><div class="pbar"><div class="pfill" style="width:${s.prog}%"></div></div>${presupuesto?`<div class="pmeta" style="margin-top:10px"><span>Coste: ${money(gastado)}</span><span>Presupuesto: ${money(presupuesto)}</span></div><div class="pbar"><div class="pfill" style="width:${Math.min(100,Math.round(gastado/presupuesto*100))}%;background:${gastado>presupuesto?'var(--bad)':'var(--ok)'}"></div></div>`:''}</div>`}
function abrirP(id){pid=id;render()}
function renderP(){const p=DB.getProyecto(pid);if(!p){volver();return}setHdr(p.nombre,1);const s=DB.statsP(p.id);let ts=DB.tareas(p.id);if(flt.txt){const q=flt.txt.toLowerCase();ts=ts.filter(t=>t.titulo.toLowerCase().includes(q)||(t.desc||'').toLowerCase().includes(q))}if(flt.est)ts=ts.filter(t=>t.estado===flt.est);if(flt.pri)ts=ts.filter(t=>t.prioridad===flt.pri);document.getElementById('app').innerHTML=`<div class="card"><p style="font-size:13px;color:var(--g6);margin-bottom:10px">${eh(p.desc)||'Sin descripción'}</p><div class="pwrap"><div class="pbar"><div class="pfill" style="width:${s.prog}%"></div></div><span>${s.prog}%</span></div><div class="brow" style="margin-top:14px"><button class="btns" onclick="exportarP(${p.id})">📤 Export</button><button class="btns" onclick="editP(${p.id})">✏️ Editar</button><button class="btns" style="background:#f8d7da;color:#721c24" onclick="delP(${p.id})">🗑️</button></div></div><div class="flt"><input type="text" placeholder="🔍 Buscar tareas..." value="${flt.txt}" oninput="flt.txt=this.value;renderP()"><div class="frow"><select onchange="flt.est=this.value;renderP()"><option value="">Todos los estados</option><option value="pendiente" ${flt.est==='pendiente'?'selected':''}>⏳ Pendiente</option><option value="en_progreso" ${flt.est==='en_progreso'?'selected':''}>🔄 En progreso</option><option value="completada" ${flt.est==='completada'?'selected':''}>✅ Completada</option><option value="bloqueada" ${flt.est==='bloqueada'?'selected':''}>🚫 Bloqueada</option></select><select onchange="flt.pri=this.value;renderP()"><option value="">Todas las prioridades</option><option value="baja" ${flt.pri==='baja'?'selected':''}>Baja</option><option value="media" ${flt.pri==='media'?'selected':''}>Media</option><option value="alta" ${flt.pri==='alta'?'selected':''}>Alta</option><option value="urgente" ${flt.pri==='urgente'?'selected':''}>Urgente</option></select></div></div><h2 style="font-size:16px;margin-bottom:12px">Tareas (${ts.length})</h2>${ts.length?ts.map(titem).join(''):`<div class="emp"><div class="ico">📋</div><p>Sin tareas</p></div>`}`}
function titem(t){const vc=t.fl&&t.estado!=='completada'&&new Date(t.fl)<new Date();return`<div class="titem ${t.estado}"><input type="checkbox" class="tcheck" ${t.estado==='completada'?'checked':''} onchange="toggleT(${t.id},this.checked)"><div class="tbody" onclick="verT(${t.id})"><div class="ttit">${eh(t.titulo)}</div><div class="tmeta"><span class="bdg b-${t.estado}">${ie(t.estado)} ${le(t.estado)}</span><span class="bdg b-${t.prioridad}">${lp(t.prioridad)}</span>${t.fl?`<span style="color:${vc?'#dc3545':'inherit'}">📅 ${ff(t.fl)}</span>`:''}</div></div><div class="tacts"><button class="ibtn" onclick="editT(${t.id})">✏️</button></div></div>`}
function toggleT(id,c){DB.updTarea(id,{estado:c?'completada':'pendiente'});tst(c?'✅ Completada':'Reabierta','ok');render()}
function renderTG(){let ts=DB.tareas();if(flt.txt){const q=flt.txt.toLowerCase();ts=ts.filter(t=>t.titulo.toLowerCase().includes(q))}if(flt.est)ts=ts.filter(t=>t.estado===flt.est);document.getElementById('app').innerHTML=`<div class="flt"><input type="text" placeholder="🔍 Buscar..." value="${flt.txt}" oninput="flt.txt=this.value;renderTG()"><select onchange="flt.est=this.value;renderTG()"><option value="">Todos los estados</option><option value="pendiente" ${flt.est==='pendiente'?'selected':''}>⏳ Pendiente</option><option value="en_progreso" ${flt.est==='en_progreso'?'selected':''}>🔄 En progreso</option><option value="completada" ${flt.est==='completada'?'selected':''}>✅ Completada</option><option value="bloqueada" ${flt.est==='bloqueada'?'selected':''}>🚫 Bloqueada</option></select></div>${ts.length?ts.map(titem).join(''):`<div class="emp"><div class="ico">📋</div><p>No hay tareas</p></div>`}`}
function renderStats(){const s=DB.stats();const prs=DB.proyectos();document.getElementById('app').innerHTML=`<div class="card"><h2>Resumen General</h2><div class="pwrap"><div class="pbar"><div class="pfill" style="width:${s.prog}%"></div></div><span>${s.prog}%</span></div></div><div class="card"><h2>Estados</h2><div class="tmeta" style="gap:16px;font-size:14px;flex-direction:column;align-items:flex-start"><span>⏳ Pendientes: <b>${s.pd}</b></span><span>🔄 En progreso: <b>${s.pr}</b></span><span>✅ Completadas: <b>${s.ok}</b></span><span>🚫 Bloqueadas: <b>${s.bl}</b></span><span>⚠️ Vencidas: <b>${s.vc}</b></span></div></div><div class="card"><h2>Por Proyecto</h2>${prs.length?prs.map(p=>{const st=DB.statsP(p.id);return`<div style="margin-bottom:14px"><div style="font-size:14px;font-weight:600;margin-bottom:6px">${eh(p.nombre)}</div><div class="pwrap"><div class="pbar"><div class="pfill" style="width:${st.prog}%"></div></div><span>${st.prog}%</span></div></div>`}).join(''):'<p style="color:var(--g6);font-size:13px">Sin proyectos</p>'}</div>`}
function openM(html){document.getElementById('mcnt').innerHTML=html;document.getElementById('mdl').classList.add('on')}
function closeM(){document.getElementById('mdl').classList.remove('on')}
document.getElementById('mdl').addEventListener('click',e=>{if(e.target.id==='mdl')closeM()});
function mhdr(t){return`<div class="mhdr"><h2>${t}</h2><button class="mcls" onclick="closeM()">✕</button></div>`}
function accion(){if(pid)nuevaT();else nuevoP()}
function nuevoP(){openM(mhdr('Nuevo Proyecto')+`<div class="fg"><label>Nombre *</label><input type="text" id="pN" placeholder="Ej: Rediseño web"></div><div class="fg"><label>Descripción</label><textarea id="pD" rows="3" placeholder="Describe el proyecto"></textarea></div><div class="frow"><div class="fg"><label>Presupuesto (€)</label><input type="number" id="pB" min="0" step="0.01" value="0"></div><div class="fg"><label>Gastado (€)</label><input type="number" id="pG" min="0" step="0.01" value="0"></div></div><button class="btnp" onclick="guardarP()">Crear proyecto</button>`)}
function guardarP(){const nombre=document.getElementById('pN').value.trim();if(!nombre){tst('Escribe un nombre','err');return}DB.addProyecto({nombre,desc:document.getElementById('pD').value.trim(),presupuesto:Number(document.getElementById('pB').value)||0,gastado:Number(document.getElementById('pG').value)||0});closeM();tst('Proyecto creado','ok');render()}
function menuOpc(){openM(mhdr('Opciones')+`<button class="btns" style="width:100%;margin-bottom:8px" onclick="exportarTodo()">📤 Exportar datos</button><button class="btnd" onclick="borrarDatos()">🗑️ Borrar todos los datos</button>`)}
function borrarDatos(){if(!confirm('¿Borrar todos los proyectos y tareas?'))return;localStorage.removeItem(DB.k);closeM();tst('Datos borrados','ok');render()}
function editP(id){const p=DB.getProyecto(id);if(!p)return;openM(mhdr('Editar proyecto')+`<div class="fg"><label>Nombre *</label><input id="eN" value="${eh(p.nombre)}"></div><div class="fg"><label>Descripción</label><textarea id="eD" rows="3">${eh(p.desc||'')}</textarea></div><div class="frow"><div class="fg"><label>Presupuesto (€)</label><input type="number" id="eB" min="0" step="0.01" value="${Number(p.presupuesto)||0}"></div><div class="fg"><label>Gastado (€)</label><input type="number" id="eG" min="0" step="0.01" value="${Number(p.gastado)||0}"></div></div><button class="btnp" onclick="guardarEdicionP(${id})">Guardar cambios</button>`)}
function guardarEdicionP(id){const nombre=document.getElementById('eN').value.trim();if(!nombre){tst('Escribe un nombre','err');return}DB.updProyecto(id,{nombre,desc:document.getElementById('eD').value.trim(),presupuesto:Number(document.getElementById('eB').value)||0,gastado:Number(document.getElementById('eG').value)||0});closeM();tst('Proyecto actualizado','ok');render()}
function delP(id){if(!confirm('¿Eliminar este proyecto y sus tareas?'))return;DB.delProyecto(id);pid=null;vista='proyectos';render()}
function nuevaT(){openM(mhdr('Nueva tarea')+`<div class="fg"><label>Título *</label><input id="tN" placeholder="Ej: Preparar informe"></div><div class="fg"><label>Descripción</label><textarea id="tD" rows="3"></textarea></div><div class="fg"><label>Prioridad</label><select id="tP"><option value="baja">Baja</option><option value="media" selected>Media</option><option value="alta">Alta</option><option value="urgente">Urgente</option></select></div><button class="btnp" onclick="guardarT()">Crear tarea</button>`)}
function guardarT(){const titulo=document.getElementById('tN').value.trim();if(!titulo){tst('Escribe un título','err');return}DB.addTarea({proyectoId:pid,titulo,desc:document.getElementById('tD').value.trim(),prioridad:document.getElementById('tP').value});closeM();tst('Tarea creada','ok');render()}
function editT(id){const t=DB.getTarea(id);if(!t)return;const estado=prompt('Estado: pendiente, en_progreso, completada o bloqueada',t.estado);if(estado===null)return;if(!['pendiente','en_progreso','completada','bloqueada'].includes(estado))return tst('Estado no válido','err');DB.updTarea(id,{estado});render()}
function verT(id){const t=DB.getTarea(id);if(!t)return;openM(mhdr(t.titulo)+`<p style="margin-bottom:12px">${eh(t.desc)||'Sin descripción'}</p><p class="tmeta">${ie(t.estado)} ${le(t.estado)} · ${lp(t.prioridad)}</p>`)}
function exportarP(id){descargar(JSON.stringify({proyecto:DB.getProyecto(id),tareas:DB.tareas(id)},null,2),'proyecto-'+id+'.json')}
function exportarTodo(){descargar(JSON.stringify(DB.d(),null,2),'gestor-proyectos.json');closeM()}
function descargar(texto,nombre){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([texto],{type:'application/json'}));a.download=nombre;a.click();URL.revokeObjectURL(a.href)}
function renderStats(){const s=DB.stats();const c=costStats();const prs=DB.proyectos();const estados=[['pendiente','Pendientes',s.pd,'#ffc107'],['en_progreso','En progreso',s.pr,'#4472C4'],['completada','Completadas',s.ok,'#28a745'],['bloqueada','Bloqueadas',s.bl,'#dc3545']];const maxEstado=Math.max(1,...estados.map(x=>x[2]));document.getElementById('app').innerHTML=`<div class="stats"><div class="stat"><div class="ico">💰</div><div class="val">${money(c.gastado)}</div><div class="lb">Gastado</div></div><div class="stat"><div class="ico">🎯</div><div class="val">${money(c.presupuesto)}</div><div class="lb">Presupuesto</div></div><div class="stat ${c.restante<0?'bad':'ok'}"><div class="ico">${c.restante<0?'⚠️':'📌'}</div><div class="val">${money(c.restante)}</div><div class="lb">Disponible</div></div><div class="stat"><div class="ico">📋</div><div class="val">${s.total}</div><div class="lb">Tareas</div></div></div><div class="card"><h2>Control de costes</h2><div class="pmeta"><span>Uso del presupuesto</span><b>${c.porcentaje}%</b></div><div class="pbar"><div class="pfill" style="width:${Math.min(100,Math.max(0,c.porcentaje))}%;background:${c.restante<0?'var(--bad)':'var(--ok)'}"></div></div><div class="pmeta" style="margin-top:10px"><span>Gastado: ${money(c.gastado)}</span><span>Disponible: ${money(c.restante)}</span></div></div><div class="card"><h2>Costes por proyecto</h2>${prs.length?prs.map(p=>{const b=Number(p.presupuesto)||0;const g=Number(p.gastado)||0;const pct=b?Math.min(100,Math.round(g/b*100)):0;return`<div style="margin-bottom:16px"><div class="pmeta"><span>${eh(p.nombre)}</span><span>${money(g)} / ${money(b)}</span></div><div class="pbar"><div class="pfill" style="width:${pct}%;background:${g>b?'var(--bad)':'var(--p)'}"></div></div></div>`}).join(''):'<p style="color:var(--g6);font-size:13px">Crea proyectos para ver sus costes</p>'}</div><div class="card"><h2>Distribución de tareas</h2>${estados.map(x=>`<div style="display:flex;align-items:center;gap:10px;margin:10px 0;font-size:13px"><span style="width:92px">${x[1]}</span><div class="pbar"><div style="height:100%;width:${Math.round(x[2]/maxEstado*100)}%;background:${x[3]};border-radius:10px;transition:width .4s"></div></div><b style="min-width:24px;text-align:right">${x[2]}</b></div>`).join('')}</div>`}

function editP(id){const p=DB.getProyecto(id);if(!p)return;openM(mhdr('Editar proyecto')+`<div class="fg"><label>Nombre *</label><input id="eN" value="${eh(p.nombre)}"></div><div class="fg"><label>Descripción</label><textarea id="eD" rows="3">${eh(p.desc||'')}</textarea></div><div class="frow"><div class="fg"><label>Presupuesto (€)</label><input type="number" id="eB" min="0" step="0.01" value="${Number(p.presupuesto)||0}"></div><div class="fg"><label>Gastado (€)</label><input type="number" id="eG" min="0" step="0.01" value="${Number(p.gastado)||0}"></div></div><button class="btnp" onclick="guardarEdicionP(${id})">Guardar cambios</button><button class="btnd" style="margin-top:8px" onclick="delP(${id})">🗑️ Eliminar proyecto</button>`)}

function nuevoP(){openM(mhdr('Nuevo Proyecto')+`<div class="fg"><label>Nombre *</label><input type="text" id="pN" placeholder="Ej: Rediseño web"></div><div class="fg"><label>Descripción</label><textarea id="pD" rows="3" placeholder="Describe el proyecto"></textarea></div><div class="frow"><div class="fg"><label>Presupuesto ($)</label><input type="number" id="pB" min="0" step="0.01" value="0"></div><div class="fg"><label>Gastado ($)</label><input type="number" id="pG" min="0" step="0.01" value="0"></div></div><button class="btnp" onclick="guardarP()">Crear proyecto</button>`)}
function editP(id){const p=DB.getProyecto(id);if(!p)return;openM(mhdr('Editar proyecto')+`<div class="fg"><label>Nombre *</label><input id="eN" value="${eh(p.nombre)}"></div><div class="fg"><label>Descripción</label><textarea id="eD" rows="3">${eh(p.desc||'')}</textarea></div><div class="frow"><div class="fg"><label>Presupuesto ($)</label><input type="number" id="eB" min="0" step="0.01" value="${Number(p.presupuesto)||0}"></div><div class="fg"><label>Gastado ($)</label><input type="number" id="eG" min="0" step="0.01" value="${Number(p.gastado)||0}"></div></div><button class="btnp" onclick="guardarEdicionP(${id})">Guardar cambios</button><button class="btnd" style="margin-top:8px" onclick="delP(${id})">🗑️ Eliminar proyecto</button>`)}

function pcard(p){const s=DB.statsP(p.id);const r=resultadoProyecto(p);const color=r.resultado<0?'var(--bad)':'var(--ok)';return`<div class="pcard" onclick="abrirP(${p.id})"><h3>${eh(p.nombre)}</h3><div class="desc">${eh(p.desc)||'Sin descripción'}</div><div class="pmeta"><span>${s.ok}/${s.tot} tareas</span><b>${s.prog}% avance</b></div><div class="pbar"><div class="pfill" style="width:${s.prog}%"></div></div><div class="project-kpis"><div><b>${money(r.ingreso)}</b><span>Ingreso</span></div><div><b>${money(r.coste)}</b><span>Coste</span></div><div><b style="color:${color}">${money(r.resultado)}</b><span>${r.resultado<0?'Pérdida':'Ganancia'}</span></div></div></div>`}
function renderP(){const p=DB.getProyecto(Number(pid));if(!p){volver();return}const s=DB.statsP(p.id);const r=resultadoProyecto(p);const tareas=DB.tareas(p.id);const color=r.resultado<0?'var(--bad)':'var(--ok)';setHdr(p.nombre,1);document.getElementById('app').innerHTML=`<section class="welcome"><h2>${eh(p.nombre)}</h2><p>${eh(p.desc)||'Gestiona aquí el avance y el resultado financiero.'}</p></section><div class="stats"><div class="stat"><div class="ico">📈</div><div class="val">${s.prog}%</div><div class="lb">Avance</div></div><div class="stat"><div class="ico">💵</div><div class="val">${money(r.ingreso)}</div><div class="lb">Ingreso</div></div><div class="stat"><div class="ico">💸</div><div class="val">${money(r.coste)}</div><div class="lb">Coste</div></div><div class="stat ${r.resultado<0?'bad':'ok'}"><div class="ico">${r.resultado<0?'📉':'📈'}</div><div class="val" style="color:${color}">${money(r.resultado)}</div><div class="lb">${r.resultado<0?'Pérdida':'Ganancia'}</div></div></div><div class="card"><h2>Resultado del proyecto</h2><div class="pmeta"><span>Ingreso: ${money(r.ingreso)}</span><span>Coste: ${money(r.coste)}</span></div><div class="pmeta" style="font-size:18px;margin-top:14px"><b>${r.resultado<0?'Pérdida':'Ganancia'}</b><b style="color:${color}">${money(r.resultado)}</b></div></div><button class="btnp" onclick="nuevaT()">＋ Nueva tarea en este proyecto</button><h2 style="font-size:16px;margin:16px 0 12px">Tareas (${tareas.length})</h2>${tareas.length?tareas.map(titem).join(''):`<div class="emp"><div class="ico">📋</div><p>Aún no hay tareas</p></div>`}`}
function renderStats(){const prs=DB.proyectos();document.getElementById('app').innerHTML=`<section class="welcome"><h2>Ganancia o pérdida por proyecto</h2><p>Resultado individual: ingreso previsto menos coste gastado.</p></section>${prs.length?prs.map(p=>{const r=resultadoProyecto(p);const s=DB.statsP(p.id);const color=r.resultado<0?'var(--bad)':'var(--ok)';return`<div class="card" onclick="abrirP(${p.id})" style="cursor:pointer"><div class="pmeta"><b>${eh(p.nombre)}</b><span>${s.prog}% avance</span></div><div class="pmeta" style="margin-top:12px"><span>Ingreso: ${money(r.ingreso)}</span><span>Coste: ${money(r.coste)}</span><b style="color:${color}">${r.resultado<0?'Pérdida':'Ganancia'}: ${money(r.resultado)}</b></div><div class="pbar" style="margin-top:10px"><div class="pfill" style="width:${Math.min(100,Math.max(0,s.prog))}%;background:${color}"></div></div></div>`}).join(''):'<div class="emp"><div class="ico">📊</div><p>Crea un proyecto para ver su resultado</p></div>'}`}
function evaluación(p){return{estimacion:Number(p.estimacion)||0,retraso:Number(p.retraso)||0,sobrecosto:Number(p.sobrecosto)||0,inicial:p.evaluacionInicial||'',final:p.evaluacionFinal||''}}
function nuevoP(){openM(mhdr('Nuevo Proyecto')+`<div class="fg"><label>Nombre *</label><input type="text" id="pN" placeholder="Ej: Rediseño web"></div><div class="fg"><label>Descripción</label><textarea id="pD" rows="3"></textarea></div><div class="card"><h2>Estimaciones y evaluación</h2><div class="frow"><div class="fg"><label>Estimación ($)</label><input type="number" id="pE" min="0" step="0.01" value="0"></div><div class="fg"><label>Retraso (días)</label><input type="number" id="pR" min="0" value="0"></div></div><div class="fg"><label>Sobrecostos ($)</label><input type="number" id="pS" min="0" step="0.01" value="0"></div><div class="fg"><label>Evaluación inicial</label><textarea id="pEI" rows="3" placeholder="Riesgos, objetivos y expectativas"></textarea></div><div class="fg"><label>Evaluación final</label><textarea id="pEF" rows="3" placeholder="Resultado y lecciones aprendidas"></textarea></div></div><div class="frow"><div class="fg"><label>Ingreso previsto ($)</label><input type="number" id="pI" min="0" step="0.01" value="0"></div><div class="fg"><label>Coste gastado ($)</label><input type="number" id="pG" min="0" step="0.01" value="0"></div></div><div class="fg"><label>Presupuesto ($)</label><input type="number" id="pB" min="0" step="0.01" value="0"></div><button class="btnp" onclick="guardarP()">Crear proyecto</button>`)}
function guardarP(){const nombre=document.getElementById('pN').value.trim();if(!nombre){tst('Escribe un nombre','err');return}DB.addProyecto({nombre,desc:document.getElementById('pD').value.trim(),estimacion:Number(document.getElementById('pE').value)||0,retraso:Number(document.getElementById('pR').value)||0,sobrecosto:Number(document.getElementById('pS').value)||0,evaluacionInicial:document.getElementById('pEI').value.trim(),evaluacionFinal:document.getElementById('pEF').value.trim(),ingreso:Number(document.getElementById('pI').value)||0,gastado:Number(document.getElementById('pG').value)||0,presupuesto:Number(document.getElementById('pB').value)||0});closeM();tst('Proyecto creado','ok');render()}
function editP(id){const p=DB.getProyecto(id);if(!p)return;const e=evaluación(p);openM(mhdr('Editar proyecto')+`<div class="fg"><label>Nombre *</label><input id="eN" value="${eh(p.nombre)}"></div><div class="fg"><label>Descripción</label><textarea id="eD" rows="3">${eh(p.desc||'')}</textarea></div><div class="card"><h2>Estimaciones y evaluación</h2><div class="frow"><div class="fg"><label>Estimación ($)</label><input type="number" id="eE" min="0" step="0.01" value="${e.estimacion}"></div><div class="fg"><label>Retraso (días)</label><input type="number" id="eR" min="0" value="${e.retraso}"></div></div><div class="fg"><label>Sobrecostos ($)</label><input type="number" id="eS" min="0" step="0.01" value="${e.sobrecosto}"></div><div class="fg"><label>Evaluación inicial</label><textarea id="eEI" rows="3">${eh(e.inicial)}</textarea></div><div class="fg"><label>Evaluación final</label><textarea id="eEF" rows="3">${eh(e.final)}</textarea></div></div><div class="frow"><div class="fg"><label>Ingreso previsto ($)</label><input type="number" id="eI" min="0" step="0.01" value="${Number(p.ingreso)||0}"></div><div class="fg"><label>Coste gastado ($)</label><input type="number" id="eG" min="0" step="0.01" value="${Number(p.gastado)||0}"></div></div><div class="fg"><label>Presupuesto ($)</label><input type="number" id="eB" min="0" step="0.01" value="${Number(p.presupuesto)||0}"></div><button class="btnp" onclick="guardarEdicionP(${id})">Guardar cambios</button><button class="btnd" style="margin-top:8px" onclick="delP(${id})">🗑️ Eliminar proyecto</button>`)}
function guardarEdicionP(id){const nombre=document.getElementById('eN').value.trim();if(!nombre){tst('Escribe un nombre','err');return}DB.updProyecto(id,{nombre,desc:document.getElementById('eD').value.trim(),estimacion:Number(document.getElementById('eE').value)||0,retraso:Number(document.getElementById('eR').value)||0,sobrecosto:Number(document.getElementById('eS').value)||0,evaluacionInicial:document.getElementById('eEI').value.trim(),evaluacionFinal:document.getElementById('eEF').value.trim(),ingreso:Number(document.getElementById('eI').value)||0,gastado:Number(document.getElementById('eG').value)||0,presupuesto:Number(document.getElementById('eB').value)||0});closeM();tst('Proyecto actualizado','ok');render()}
function renderP(){const p=DB.getProyecto(Number(pid));if(!p){volver();return}const s=DB.statsP(p.id);const r=resultadoProyecto(p);const e=evaluación(p);const tareas=DB.tareas(p.id);const estadoRetraso=e.retraso>0?'eval-bad':'eval-good';setHdr(p.nombre,1);document.getElementById('app').innerHTML=`<div class="project-layout"><div><section class="welcome"><h2>${eh(p.nombre)}</h2><p>${eh(p.desc)||'Gestiona el proyecto y revisa su desempeño.'}</p></section><div class="stats"><div class="stat"><div class="ico">📈</div><div class="val">${s.prog}%</div><div class="lb">Avance</div></div><div class="stat"><div class="ico">💵</div><div class="val">${money(r.ingreso)}</div><div class="lb">Ingreso</div></div><div class="stat"><div class="ico">💸</div><div class="val">${money(r.coste)}</div><div class="lb">Coste</div></div><div class="stat ${r.resultado<0?'bad':'ok'}"><div class="ico">${r.resultado<0?'📉':'📈'}</div><div class="val">${money(r.resultado)}</div><div class="lb">${r.resultado<0?'Pérdida':'Ganancia'}</div></div></div><button class="btnp" onclick="nuevaT()">＋ Nueva tarea en este proyecto</button><h2 style="font-size:16px;margin:16px 0 12px">Tareas (${tareas.length})</h2>${tareas.length?tareas.map(titem).join(''):`<div class="emp"><div class="ico">📋</div><p>Aún no hay tareas</p></div>`}</div><aside class="project-sidebar card"><h2>Evaluación del proyecto</h2><div class="eval-row"><span>Estimación</span><b>${money(e.estimacion)}</b></div><div class="eval-row"><span>Retraso</span><b class="${estadoRetraso}">${e.retraso} días</b></div><div class="eval-row"><span>Sobrecostos</span><b class="${e.sobrecosto>0?'eval-bad':'eval-good'}">${money(e.sobrecosto)}</b></div><div class="eval-row"><span>Ganancia / pérdida</span><b class="${r.resultado<0?'eval-bad':'eval-good'}">${money(r.resultado)}</b></div><h2 style="margin-top:18px">Evaluación inicial</h2><p style="font-size:13px;color:var(--g6)">${eh(e.inicial)||'Sin evaluación inicial.'}</p><h2 style="margin-top:18px">Evaluación final</h2><p style="font-size:13px;color:var(--g6)">${eh(e.final)||'Pendiente de completar.'}</p><button class="btns" style="width:100%;margin-top:16px" onclick="editP(${p.id})">✏️ Editar evaluación</button></aside></div>`}
function gradoRiesgo(g){return{bajo:'Bajo',medio:'Medio',alto:'Alto',critico:'Crítico'}[g]||'Medio'}
function abrirRiesgos(){const proyectos=DB.proyectos();if(Number(pid)>0&&DB.getProyecto(Number(pid))){mostrarRiesgos(DB.getProyecto(Number(pid)));return}if(!proyectos.length){tst('Primero crea un proyecto','err');return}if(proyectos.length===1){mostrarRiesgos(proyectos[0]);return}openM(mhdr('Riesgos del proyecto')+`<div class="fg"><label>Proyecto</label><select id="riesgoProyecto">${proyectos.map(p=>`<option value="${p.id}">${eh(p.nombre)}</option>`).join('')}</select></div><button class="btnp" onclick="seleccionarRiesgos()">Ver riesgos</button>`)}
function seleccionarRiesgos(){mostrarRiesgos(DB.getProyecto(Number(document.getElementById('riesgoProyecto').value)))}
function mostrarRiesgos(p){const riesgos=(p.riesgos||[]).slice().sort((a,b)=>({critico:0,alto:1,medio:2,bajo:3}[a.grado]||2)-({critico:0,alto:1,medio:2,bajo:3}[b.grado]||2));openM(mhdr('Riesgos · '+eh(p.nombre))+`${riesgos.length?riesgos.map(r=>`<div class="risk-item risk-${r.grado}"><div class="risk-head"><span>${gradoRiesgo(r.grado)}</span><button class="ibtn" onclick="eliminarRiesgo(${p.id},${r.id})">🗑️</button></div><div class="risk-text">${eh(r.texto)}</div><div class="risk-state">Estado: ${eh(r.estado||'Pendiente')}</div></div>`).join(''):'<div class="emp" style="padding:20px"><p>No hay riesgos registrados</p></div>'}<hr style="border:0;border-top:1px solid var(--g3);margin:16px 0"><h2>Agregar riesgo</h2><div class="fg"><label>Grado</label><select id="riesgoGrado"><option value="bajo">Bajo</option><option value="medio" selected>Medio</option><option value="alto">Alto</option><option value="critico">Crítico</option></select></div><div class="fg"><label>Descripción del riesgo</label><textarea id="riesgoTexto" rows="3" placeholder="Describe el riesgo del proyecto"></textarea></div><div class="fg"><label>Estado</label><select id="riesgoEstado"><option>Pendiente</option><option>En seguimiento</option><option>Mitigado</option></select></div><button class="btnp" onclick="guardarRiesgo(${p.id})">＋ Agregar riesgo</button>`)}
function guardarRiesgo(id){const p=DB.getProyecto(id);const texto=document.getElementById('riesgoTexto').value.trim();if(!texto){tst('Describe el riesgo','err');return}const riesgos=p.riesgos||[];riesgos.push({id:Date.now(),grado:document.getElementById('riesgoGrado').value,texto,estado:document.getElementById('riesgoEstado').value});DB.updProyecto(id,{riesgos});mostrarRiesgos(DB.getProyecto(id));tst('Riesgo guardado','ok')}
function eliminarRiesgo(id,rid){const p=DB.getProyecto(id);DB.updProyecto(id,{riesgos:(p.riesgos||[]).filter(r=>r.id!==rid)});mostrarRiesgos(DB.getProyecto(id));tst('Riesgo eliminado','ok')}
function abrirInteresados(){const proyectos=DB.proyectos();if(Number(pid)>0&&DB.getProyecto(Number(pid))){mostrarInteresados(DB.getProyecto(Number(pid)));return}if(!proyectos.length){tst('Primero crea un proyecto','err');return}if(proyectos.length===1){mostrarInteresados(proyectos[0]);return}openM(mhdr('Interesados del proyecto')+`<div class="fg"><label>Proyecto</label><select id="interesadoProyecto">${proyectos.map(p=>`<option value="${p.id}">${eh(p.nombre)}</option>`).join('')}</select></div><button class="btnp" onclick="seleccionarInteresados()">Abrir interesados</button>`)}
function seleccionarInteresados(){mostrarInteresados(DB.getProyecto(Number(document.getElementById('interesadoProyecto').value)))}
function mostrarInteresados(p){openM(mhdr('Interesados · '+eh(p.nombre))+`<div class="fg"><label>Personas interesadas</label><textarea id="interesadosTexto" rows="7" placeholder="Ej: Ana López, Carlos Ruiz, Equipo de ventas">${eh((p.interesados||[]).join(', '))}</textarea><small style="display:block;color:var(--g6);margin-top:5px">Escribe los nombres separados por comas.</small></div><button class="btnp" onclick="guardarInteresados(${p.id})">💾 Guardar interesados</button>`)}
function guardarInteresados(id){const texto=document.getElementById('interesadosTexto').value;const interesados=texto.split(',').map(n=>n.trim()).filter(Boolean);DB.updProyecto(id,{interesados});closeM();tst('Interesados guardados','ok')}
let filtroCartera='';
function filtrarCartera(valor){filtroCartera=valor.toLowerCase();const proyectos=DB.proyectos().filter(p=>p.nombre.toLowerCase().includes(filtroCartera)||(p.desc||'').toLowerCase().includes(filtroCartera));const contenedor=document.getElementById('carteraResultados');if(contenedor)contenedor.innerHTML=proyectos.length?proyectos.map(pcard).join(''):`<div class="emp"><div class="ico">🔎</div><p>No encontramos proyectos</p></div>`;const contador=document.getElementById('contadorCartera');if(contador)contador.textContent=`${proyectos.length} proyecto${proyectos.length===1?'':'s'} visible${proyectos.length===1?'':'s'}`}
function renderDash(){const s=DB.stats();const c=costStats();const prs=DB.proyectos();document.getElementById('app').innerHTML=`<section class="welcome"><h2>Tu cartera de proyectos</h2><p>Busca, compara y abre cualquier proyecto al instante.</p></section><div class="quickbar"><button class="on" onclick="filtrarCartera('')">Todos (${prs.length})</button>${prs.slice(0,5).map(p=>`<button onclick="filtrarCartera('${eh(p.nombre).replace(/'/g,"\\'")}')">${eh(p.nombre)}</button>`).join('')}<button onclick="nuevoP()">＋ Nuevo proyecto</button></div><div class="interactive-search"><input type="search" placeholder="🔎 Buscar por nombre o descripción..." oninput="filtrarCartera(this.value)" value="${eh(filtroCartera)}"><span>⌕</span></div><div id="contadorCartera" class="filter-count">${prs.length} proyecto${prs.length===1?'':'s'} visibles</div><div class="stats"><div class="stat"><div class="ico">📁</div><div class="val">${s.proyectos}</div><div class="lb">Proyectos activos</div></div><div class="stat"><div class="ico">📋</div><div class="val">${s.total}</div><div class="lb">Tareas totales</div></div><div class="stat ok"><div class="ico">💰</div><div class="val">${money(c.gastado)}</div><div class="lb">Gastado</div></div><div class="stat ${c.restante<0?'bad':'ok'}"><div class="ico">📊</div><div class="val">${c.porcentaje}%</div><div class="lb">Presupuesto usado</div></div></div><div class="card"><h2>Todos tus proyectos</h2><div id="carteraResultados" class="portfolio">${prs.length?prs.map(pcard).join(''):`<div class="emp"><div class="ico">📁</div><p>Aún no hay proyectos</p></div>`}</div></div>`}
function timelineMarkup(proyecto){const avance=Math.max(0,Math.min(100,DB.statsP(proyecto.id).prog));const terminado=avance===100;return`<div class="timeline-card ${terminado?'done':''}"><div class="timeline-percent">${avance}% completado</div><div class="timeline"><div class="timeline-track" style="--progress:${avance}%"><div class="timeline-progress"></div><span class="plane" aria-label="Avance del proyecto">✈️</span></div><div class="timeline-labels"><span>Inicio</span><span>Planificación</span><span>En progreso</span><span>Revisión</span><span>Final</span></div>${terminado?'<div class="timeline-done">✅ Proyecto terminado</div>':''}</div></div>`}
const renderPConTimeline=renderP;renderP=function(){renderPConTimeline();if(!pid)return;const contenedor=document.getElementById('app');const principal=contenedor.querySelector('.project-layout>div');if(principal){const encabezado=principal.querySelector('.welcome');if(encabezado)encabezado.insertAdjacentHTML('afterend',timelineMarkup(DB.getProyecto(Number(pid))))}};
const nuevoPBase=nuevoP;
nuevoP=function(){nuevoPBase();const boton=document.querySelector('#mcnt .btnp');if(boton)boton.insertAdjacentHTML('beforebegin','<div class="fg"><label for="pRestricciones">Restricciones</label><textarea id="pRestricciones" rows="3" placeholder="Límites de tiempo, recursos, presupuesto u otros requisitos"></textarea></div>')};
const editPBase=editP;
editP=function(id){editPBase(id);const proyecto=DB.getProyecto(id);const boton=document.querySelector('#mcnt .btnp');if(boton&&proyecto)boton.insertAdjacentHTML('beforebegin',`<div class="fg"><label for="eRestricciones">Restricciones</label><textarea id="eRestricciones" rows="3" placeholder="Límites de tiempo, recursos, presupuesto u otros requisitos">${eh(proyecto.restricciones||'')}</textarea></div>`)};
const addProyectoBase=DB.addProyecto;
DB.addProyecto=function(proyecto){const campo=document.getElementById('pRestricciones');if(campo)proyecto.restricciones=campo.value.trim();return addProyectoBase.call(this,proyecto)};
const updProyectoBase=DB.updProyecto;
DB.updProyecto=function(id,cambios){const campo=document.getElementById('eRestricciones');if(campo)cambios.restricciones=campo.value.trim();return updProyectoBase.call(this,id,cambios)};
const renderPConRestricciones=renderP;
renderP=function(){renderPConRestricciones();if(!pid)return;const proyecto=DB.getProyecto(Number(pid));const principal=document.querySelector('#app .project-layout>div');if(!proyecto||!principal)return;const referencia=principal.querySelector('.timeline-card')||principal.querySelector('.welcome');if(referencia)referencia.insertAdjacentHTML('afterend',`<section class="card"><h2>Restricciones</h2><p style="font-size:13px;color:var(--g6);white-space:pre-wrap">${eh(proyecto.restricciones)||'Sin restricciones registradas.'}</p><button class="btns" style="margin-top:12px" onclick="editP(${proyecto.id})">✏️ Editar restricciones</button></section>`)};
const syncPendingKey='gp_sync_pending_v1';
let syncRevision=0;
let syncInFlight=false;
async function syncPendingData(){if(location.protocol==='file:'||!navigator.onLine||syncInFlight||localStorage.getItem(syncPendingKey)!=='1')return;syncInFlight=true;try{while(navigator.onLine&&localStorage.getItem(syncPendingKey)==='1'){const revision=syncRevision;const snapshot=localStorage.getItem(DB.k);const response=await fetch('/api/data',{method:'PUT',headers:{'Content-Type':'application/json'},body:snapshot});if(!response.ok)throw new Error('No se pudo sincronizar');if(revision===syncRevision)localStorage.removeItem(syncPendingKey)}}catch{localStorage.setItem(syncPendingKey,'1')}finally{syncInFlight=false}}
DB.s=function(data){localStorage.setItem(this.k,JSON.stringify(data));localStorage.setItem(syncPendingKey,'1');syncRevision++;syncPendingData()};
window.addEventListener('online',syncPendingData);
const sharedAccessKey=new URLSearchParams(location.hash.slice(1)).get('access')||localStorage.getItem('gp_access_key')||'';
if(sharedAccessKey)localStorage.setItem('gp_access_key',sharedAccessKey);
const originalFetch=window.fetch.bind(window);
window.fetch=function(resource,options={}){let target;try{target=new URL(typeof resource==='string'?resource:resource.url,location.href)}catch{}if(sharedAccessKey&&target&&target.origin===location.origin&&target.pathname==='/api/data'){const headers=new Headers(options.headers||{});headers.set('X-Access-Key',sharedAccessKey);options={...options,headers}}return originalFetch(resource,options)};
const compartirEnlaceBase=compartirEnlace;
compartirEnlace=function(){if(!sharedAccessKey){compartirEnlaceBase();return}const url=new URL(location.href);url.hash=new URLSearchParams({access:sharedAccessKey}).toString();const enlace=url.toString();if(navigator.share){navigator.share({title:'Gestor de Proyectos',text:'Trabaja en este dashboard de proyectos',url:enlace}).then(()=>tst('Enlace compartido','ok')).catch(()=>{});return}if(navigator.clipboard){navigator.clipboard.writeText(enlace).then(()=>tst('Enlace copiado al portapapeles','ok')).catch(()=>prompt('Copia este enlace',enlace));return}prompt('Copia este enlace',enlace)};
const hydrateServerBase=hydrateFromServerIfAvailable;
hydrateFromServerIfAvailable=function(){if(localStorage.getItem(syncPendingKey)==='1'){syncPendingData();return}hydrateServerBase()};
hydrateFromServerIfAvailable();
</script>
